<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockLens Academy</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060810; --bg2: #0d0f1a;
  --border2: rgba(255,255,255,0.14);
  --text: #f0f0f8; --text2: #c8c8d8;
  --muted: rgba(240,240,248,0.42);
  --accent: #00e5a0; --accent-glow: rgba(0,229,160,0.25);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Heebo', sans-serif;
  min-height: 100vh; display: flex;
  align-items: center; justify-content: center; padding: 24px;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 30%, rgba(0,229,160,0.07) 0%, transparent 70%);
  pointer-events: none;
}
.card {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 20px; padding: 48px 40px;
  max-width: 420px; width: 100%; text-align: center;
  position: relative; z-index: 1;
}
.logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.5rem; color: var(--accent); margin-bottom: 4px; }
.sub { font-size: 0.68rem; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 32px; }
.title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.15rem; margin-bottom: 8px; }
.desc { font-size: 0.85rem; color: var(--text2); margin-bottom: 32px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--accent); color: #000; border: none; border-radius: 12px;
  padding: 14px 32px; font-family: 'Heebo', sans-serif; font-size: 1rem;
  font-weight: 700; cursor: pointer; transition: all 0.2s;
  box-shadow: 0 0 28px var(--accent-glow); width: 100%;
}
.btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
.note { font-size: 0.72rem; color: var(--muted); margin-top: 20px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">StockLens</div>
  <div class="sub">Academy</div>
  <div class="title">כניסה לקורס</div>
  <div class="desc">יש להתחבר עם הפרטים שקיבלת כדי לגשת לתוכן הקורס</div>
  <button class="btn" id="loginBtn" onclick="netlifyIdentity.open()">
    🔑 כניסה / הרשמה
  </button>
  <p class="note">© StockLens Academy · לידור פיליבה · כל הזכויות שמורות</p>
</div>

<script>
var hash = window.location.hash;

// טיפול בכל סוגי הטוקנים של Netlify Identity
if (hash) {
  if (hash.includes('invite_token')) {
    netlifyIdentity.open('signup');
  } else if (hash.includes('recovery_token')) {
    netlifyIdentity.open('recovery');
  } else if (hash.includes('confirmation_token')) {
    netlifyIdentity.open('signup');
  }
}

netlifyIdentity.on('login', function(user) {
  window.location.href = '/course/course.html';
});

netlifyIdentity.on('signup', function(user) {
  window.location.href = '/course/course.html';
});

netlifyIdentity.on('init', function(user) {
  if (user) {
    window.location.href = '/course/course.html';
  }
});
</script>
</body>
</html>
